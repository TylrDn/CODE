name: "Feature Spec"
description: "Spec a new feature for Copilot to implement"
labels: ["copilot", "feature"]
body:
  - type: input
    id: summary
    attributes:
      label: "One-line summary"
      placeholder: "Add dark mode toggle to settings page"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Context & motivation"
      description: "Why does this exist? What problem does it solve?"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "Bullet list — each item must be verifiable"
      placeholder: |
        - [ ] Toggle appears in Settings > Appearance
        - [ ] Preference persists across sessions
        - [ ] System preference used as default
    validations:
      required: true

  - type: textarea
    id: stack
    attributes:
      label: "Stack constraints"
      description: "Language, framework, libraries, or patterns to use/avoid"
      placeholder: "React + Tailwind. No new dependencies."

  - type: textarea
    id: out_of_scope
    attributes:
      label: "Out of scope"
      description: "Explicitly list what this PR should NOT touch"
      placeholder: "Do not touch auth flows or user profile logic."

  - type: input
    id: spec_link
    attributes:
      label: "Spec link (optional)"
      description: "Notion page, Figma frame, or doc URL"
      placeholder: "https://notion.so/..."
