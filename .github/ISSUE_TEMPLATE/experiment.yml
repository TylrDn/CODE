name: "Experiment"
description: "Quick spike or proof-of-concept — not production code"
labels: ["copilot", "experiment"]
body:
  - type: input
    id: hypothesis
    attributes:
      label: "Hypothesis"
      placeholder: "Can we replace the current parser with tree-sitter and keep all tests green?"
    validations:
      required: true

  - type: textarea
    id: what_to_build
    attributes:
      label: "What to build"
      description: "Minimal implementation needed to validate the hypothesis"
    validations:
      required: true

  - type: textarea
    id: success_criteria
    attributes:
      label: "Success criteria"
      description: "How will we know the experiment succeeded or failed?"
      placeholder: |
        - [ ] Parses all 10 sample files without error
        - [ ] Parse time < 50ms per file
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: "Constraints"
      placeholder: "Timebox: 2 hours. No production code changes. Branch: exp/tree-sitter"

  - type: dropdown
    id: outcome
    attributes:
      label: "Expected outcome"
      options:
        - "Adopt if successful"
        - "Learning only — discard branch after"
        - "Undecided"
