name: Lint

on:
  pull_request:
    paths:
      - "bootstrap.sh"
      - ".github/workflows/lint.yml"

jobs:
  shellcheck:
    name: ShellCheck bootstrap.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck bootstrap.sh
