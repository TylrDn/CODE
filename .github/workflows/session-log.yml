# Auto-creates a session log entry when a PR is merged
# Log is committed to session-log/YYYY-MM-DD-<branch>.md

name: Session Log on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  log:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate session log
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          DATE=$(echo "$MERGED_AT" | cut -c1-10)
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')
          FILENAME="session-log/${DATE}-${SAFE_BRANCH}.md"
          mkdir -p session-log
          cat > "$FILENAME" << EOF
          # Session Log: ${PR_TITLE}

          - **PR:** [#${PR_NUMBER}](${PR_URL})
          - **Branch:** ${BRANCH}
          - **Author:** ${AUTHOR}
          - **Merged:** ${MERGED_AT}

          ## Summary
          ${PR_BODY}

          ## Commits
          $(git log --oneline origin/main..HEAD 2>/dev/null || echo 'See PR for commit list')
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILENAME"
          git commit -m "chore(session-log): auto-log PR #${PR_NUMBER} [skip ci]" || echo 'Nothing to commit'
          git push
