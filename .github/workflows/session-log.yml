name: Session Log

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  log-session:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Generate session log
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          DATE=$(echo "$PR_MERGED_AT" | cut -c1-10)
          SLUG=$(echo "$PR_BRANCH" | sed 's/[^a-zA-Z0-9]/-/g')
          FILE="session-log/${DATE}-${SLUG}.md"
          mkdir -p session-log

          cat > "$FILE" << EOF
          # Session Log: ${PR_TITLE}

          - **PR**: [#${PR_NUMBER}](${PR_URL})
          - **Branch**: \`${PR_BRANCH}\`
          - **Author**: ${PR_AUTHOR}
          - **Merged**: ${PR_MERGED_AT}

          ## Summary

          ${PR_BODY}

          ## Commits

          \`\`\`
          $(git log --oneline origin/main~1..origin/main)
          \`\`\`
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(session-log): add log for PR #${PR_NUMBER}" || echo "No changes to commit"
          git push
