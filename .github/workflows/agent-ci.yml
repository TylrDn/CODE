# Reusable CI workflow for TylrDn swarm repos
# Usage in downstream repo:
#   jobs:
#     ci:
#       uses: TylrDn/CODE/.github/workflows/agent-ci.yml@main
#       with:
#         node-version: '20'

name: Agent CI

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        default: '20'
        type: string
      run-lint:
        description: 'Run ESLint'
        required: false
        default: true
        type: boolean
      run-test:
        description: 'Run tests'
        required: false
        default: true
        type: boolean
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version || '20' }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --if-present

      - name: Lint
        if: ${{ inputs.run-lint != false }}
        run: npm run lint --if-present
        continue-on-error: false

      - name: Test
        if: ${{ inputs.run-test != false }}
        run: npm test --if-present
        continue-on-error: false

  session-log:
    name: Auto Session Log
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write session log
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="${{ github.event.pull_request.head.ref }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          LOG_FILE="session-log/${DATE}-${BRANCH}.md"
          mkdir -p session-log
          echo "# Session Log: ${DATE} — ${BRANCH}" > "$LOG_FILE"
          echo "" >> "$LOG_FILE"
          echo "**PR:** [#${PR_NUM}](https://github.com/${{ github.repository }}/pull/${PR_NUM}) — ${PR_TITLE}" >> "$LOG_FILE"
          echo "**Merged:** ${DATE}" >> "$LOG_FILE"
          echo "" >> "$LOG_FILE"
          echo "## Commits" >> "$LOG_FILE"
          git log origin/main..HEAD --oneline --no-merges | head -20 >> "$LOG_FILE" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$LOG_FILE"
          git diff --cached --quiet || git commit -m "chore(session-log): auto-log for ${BRANCH} [skip ci]"
          git push
